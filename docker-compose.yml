services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - app_data:/var/www/node_modules
    environment:
      - DB_HOST=db
      - DB_DATABASE=role_users
      - DB_USERNAME=admin
      - DB_PASSWORD=admin
    depends_on:
      - db
    networks:
      laravel:
        ipv4_address: 192.168.1.100

  db:
    image: mysql:8
    container_name: mysql_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: role_users
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      laravel:
        ipv4_address: 192.168.1.101

  node:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node_vite
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - app_data:/var/www/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      laravel:
        ipv4_address: 192.168.1.103

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./public:/var/www/public:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
      - node
    networks:
      laravel:
        ipv4_address: 192.168.1.102

networks:
  laravel:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1

volumes:
  mysql_data:
  app_data: